server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # These identity and trust headers are rendered into the server-side
        # template at container startup. Browser-supplied bridge headers are
        # intentionally ignored so the static Web client cannot spoof them.
        proxy_set_header X-Hub-User-ID "${INSIGHT_DEFAULT_HUB_USER_ID}";
        proxy_set_header X-Hub-Device-Count "${INSIGHT_DEFAULT_DEVICE_COUNT}";
        proxy_set_header X-Insight-Bridge-Token "${INSIGHT_TRUSTED_BRIDGE_TOKEN}";
        proxy_pass http://api:18081;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://api:18081;
    }
}
