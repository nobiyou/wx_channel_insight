name: Bug Report
description: Report a defect in wx_channel_insight
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope And Impact
      description: Which area is affected? Dashboard, workspace bridge, reports, topic lab, etc.
      placeholder: Impacted modules, user flow, and severity.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste logs, screenshots, request/response samples, or commit refs if available.
      placeholder: Supporting evidence.

  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary Check
      options:
        - label: This issue belongs to wx_channel_insight rather than wx_channel_hub
        - label: This issue is not requesting analytics logic to move back into Hub
